<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard – StudioGo</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="admin">
  <div id="hdr"></div>
  
  <section style="padding-top:36px">
    <div class="wrap">
      <h2>Dashboard Admin</h2>
      <p class="sub">Pantau semua pesanan dan balas chat dari pelanggan.</p>
      
      <!-- Ringkasan Statistik -->
      <div class="orders-summary" id="adminStats"></div>

      <div class="split" style="grid-template-columns: 1.5fr 1fr; gap: 24px; margin-top: 24px;">
        
        <!-- KOLOM KIRI: Tabel Pesanan -->
        <div class="panel">
          <h3 class="t">Semua Pesanan Masuk</h3>
          <div id="adminTable" style="overflow-x:auto; margin-top:16px;"></div>
        </div>

        <!-- KOLOM KANAN: Chat Admin -->
        <div class="panel" style="display:flex; flex-direction:column; height:600px; padding:0;">
          
          <div style="padding:20px; border-bottom:1px solid var(--line);">
            <h3 class="t" style="margin:0;">Ruang Chat</h3>
            <select id="adminChatSelect" class="sortsel" style="width:100%; margin-top:10px; display:none;">
              <!-- Option diisi JS -->
            </select>
          </div>

          <div id="adminChatMessages" style="flex:1; padding:20px; overflow-y:auto; background:var(--sky-2); display:flex; flex-direction:column; gap:12px;">
            <div style="text-align:center; color:var(--mute); margin-top:50px;">
              <i class="fas fa-comments" style="font-size:40px; opacity:0.3; margin-bottom:10px;"></i>
              <p style="font-size:14px;">Pilih pesanan di tabel untuk mulai membalas chat.</p>
            </div>
          </div>

          <div id="adminChatInputArea" style="padding:16px; border-top:1px solid var(--line); display:none; background:var(--bg-card);">
            <form id="adminChatForm" style="display:flex; gap:10px;">
              <input type="text" id="adminChatInput" placeholder="Balas pesan..." style="flex:1; padding:10px 14px; border-radius:10px; border:1.5px solid var(--line); outline:none; background:var(--bg-main); color:var(--ink);" autocomplete="off">
              <button type="submit" class="btn" style="padding:10px 16px;"><i class="fas fa-paper-plane"></i></button>
            </form>
          </div>
        </div>

      </div>
    </div>
  </section>

  <div id="ftr"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js"></script>
</body>
</html>
